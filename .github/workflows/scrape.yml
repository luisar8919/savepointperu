name: Scraper diario de ofertas

on:
  schedule:
    - cron: "0 7 * * *" # 7:00 UTC; el jitter de 0-60 min se aplica dentro del job
  workflow_dispatch: {} # permite correrlo manualmente desde GitHub

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Esperar un retraso aleatorio (0-60 min) dentro del rango 7-8am
        run: sleep $(( RANDOM % 3600 ))

      - name: Instalar dependencias
        working-directory: scraper
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Ejecutar scraper
        working-directory: scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scrape.py
